name: Publish to PyPI

# Publishes the package to PyPI. Releasing is a deliberate act: push a tag.
#
#     git tag -a v0.4.0 -m "Release v0.4.0"
#     git push origin v0.4.0
#
# Triggers:
#   - push of a v* tag: publishes that commit, after checking the tag and
#     pyproject.toml versions agree.
#   - manual workflow_dispatch: republish to PyPI, or push to TestPyPI.
#
# Pushing to main does NOT publish, and this workflow no longer runs on it.
#
# It used to. A push to main whose pyproject version had no matching tag would
# create the tag and publish — which made merging to main a release, and made
# `main` unusable as an integration branch. Worse, the tag was created with
# GITHUB_TOKEN, and GitHub does not trigger workflows from GITHUB_TOKEN-authored
# events (it prevents recursion). So that path published to PyPI while
# docker.yml never fired: no :latest, no :<version> image, and no error anywhere
# to say so. With Docker being the dominant deployment shape, a "release" could
# reach almost nobody.
#
# A human-pushed tag triggers this workflow and docker.yml together, so both
# channels move on one action or neither does.
#
# Uses PyPI Trusted Publishing (OIDC), so no API token needs to be stored as a
# repository secret.
#
# One-time setup on PyPI:
#   1. Create the project on https://pypi.org (or reserve the name).
#   2. Under "Publishing" -> "Add a new publisher", register this repo with:
#        Owner:           vectra-ai-research
#        Repository:      vectra-ai-mcp-server
#        Workflow name:   publish-pypi.yml
#        Environment:     pypi
#   3. (Optional) Do the same for https://test.pypi.org with environment "testpypi".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  prepare:
    name: Determine version and publish plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      should_publish: ${{ steps.compute.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and decide actions
        id: compute
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          echo "Detected pyproject.toml version: ${VERSION}"
          echo "Expected tag:                    ${TAG}"

          SHOULD_PUBLISH=false

          case "${GITHUB_EVENT_NAME}" in
            push)
              # The trigger is restricted to `tags: v*`, so a push event can only
              # be a tag. Fail loudly rather than silently doing nothing if that
              # ever stops being true.
              if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
                echo "::error::Expected a v* tag, got ${GITHUB_REF}. Releases are made by pushing a tag; pushing to a branch must not publish."
                exit 1
              fi
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}"
                exit 1
              fi
              SHOULD_PUBLISH=true
              ;;
            workflow_dispatch)
              SHOULD_PUBLISH=true
              ;;
          esac

          echo "should_publish=${SHOULD_PUBLISH}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_publish=${SHOULD_PUBLISH}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build sdist and wheel
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # astral-sh/setup-uv switched to immutable tags from v8 onward, so we
      # must pin to a specific patch version (no floating `v8` tag exists).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Quick install + console-script smoke test
        run: |
          uv venv .smoketest
          . .smoketest/bin/activate
          pip install dist/*.whl
          vectra-ai-mcp-server --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vectra-ai-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    if: |
      needs.prepare.outputs.should_publish == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vectra-ai-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
