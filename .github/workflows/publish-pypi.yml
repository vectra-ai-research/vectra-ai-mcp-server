name: Publish to PyPI

# Publishes the package to PyPI. Triggers:
#   - push to main: if pyproject.toml version doesn't have a matching v<version>
#     tag yet, the workflow creates the tag and publishes the new release.
#   - push of a v* tag (manual `git tag` + `git push --tags`): publishes the
#     tagged commit, verifying tag and pyproject.toml versions match.
#   - manual workflow_dispatch: lets you republish to PyPI or push to TestPyPI.
#
# Uses PyPI Trusted Publishing (OIDC), so no API token needs to be stored as a
# repository secret.
#
# One-time setup on PyPI:
#   1. Create the project on https://pypi.org (or reserve the name).
#   2. Under "Publishing" -> "Add a new publisher", register this repo with:
#        Owner:           vectra-ai-research
#        Repository:      vectra-ai-mcp-server
#        Workflow name:   publish-pypi.yml
#        Environment:     pypi
#   3. (Optional) Do the same for https://test.pypi.org with environment "testpypi".

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  contents: read

jobs:
  prepare:
    name: Determine version and publish plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      should_publish: ${{ steps.compute.outputs.should_publish }}
      should_tag: ${{ steps.compute.outputs.should_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and decide actions
        id: compute
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          echo "Detected pyproject.toml version: ${VERSION}"
          echo "Expected tag:                    ${TAG}"

          SHOULD_PUBLISH=false
          SHOULD_TAG=false

          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                TAG_VERSION="${GITHUB_REF_NAME#v}"
                if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
                  echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${VERSION}"
                  exit 1
                fi
                SHOULD_PUBLISH=true
              elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
                if git rev-parse --quiet --verify "refs/tags/${TAG}" >/dev/null; then
                  echo "Tag ${TAG} already exists -- nothing to publish."
                else
                  echo "Tag ${TAG} does not exist yet -- will create it and publish."
                  SHOULD_PUBLISH=true
                  SHOULD_TAG=true
                fi
              fi
              ;;
            workflow_dispatch)
              SHOULD_PUBLISH=true
              ;;
          esac

          echo "should_publish=${SHOULD_PUBLISH}"
          echo "should_tag=${SHOULD_TAG}"

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "should_tag=${SHOULD_TAG}"
          } >> "${GITHUB_OUTPUT}"

  tag:
    name: Create release tag from main
    needs: prepare
    if: needs.prepare.outputs.should_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  build:
    name: Build sdist and wheel
    needs: [prepare, tag]
    # Run when we want to publish and the tag job either succeeded (main push)
    # or was skipped (tag push / workflow_dispatch).
    if: |
      always() &&
      needs.prepare.outputs.should_publish == 'true' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # astral-sh/setup-uv switched to immutable tags from v8 onward, so we
      # must pin to a specific patch version (no floating `v8` tag exists).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Quick install + console-script smoke test
        run: |
          uv venv .smoketest
          . .smoketest/bin/activate
          pip install dist/*.whl
          vectra-ai-mcp-server --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vectra-ai-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    if: |
      needs.prepare.outputs.should_publish == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vectra-ai-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
