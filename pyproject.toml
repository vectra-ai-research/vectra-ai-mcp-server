[project]
name = "vectra-ai-mcp-server"
version = "0.3.2"
description = "MCP server for the Vectra AI Platform - exposes detection, investigation, and response tools to AI assistants."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Vectra AI Research" },
]
keywords = ["vectra", "mcp", "model-context-protocol", "security", "ndr", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.12.1,<2",
    "pyyaml>=6.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
vectra-ai-mcp-server = "vectra_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/vectra-ai-research/vectra-ai-mcp-server"
Repository = "https://github.com/vectra-ai-research/vectra-ai-mcp-server"
Issues = "https://github.com/vectra-ai-research/vectra-ai-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "src/vectra_mcp_server",
    "README.md",
    "LICENSE",
    ".env.example",
    "tenants.yaml.example",
]
