[project]
name = "vectra-ai-mcp-server"
version = "0.4.0-rc.1"
description = "MCP server for the Vectra AI Platform - exposes detection, investigation, and response tools to AI assistants."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Vectra AI Research" },
]
keywords = ["vectra", "mcp", "model-context-protocol", "security", "ndr", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.12.1,<2",
    "pyyaml>=6.0",
    "tenacity>=9.1.2",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Profile credentials live in the OS keychain rather than in an MCP
    # client's config file. A runtime dependency rather than an extra: `uvx`
    # installs into a throwaway environment, so an extra would have to be named
    # at every invocation and would be forgotten. The import is lazy, so a
    # machine with no usable keychain backend still runs on env vars.
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
# Unchanged, and deliberately so: this is what every existing MCP client
# configuration launches, usually with no arguments at all.
vectra-ai-mcp-server = "vectra_mcp_server.server:main"
# Profile management. A separate short script rather than subcommands on the
# server entry point, so that adding subparsers can never change how a bare
# `vectra-ai-mcp-server` invocation behaves.
vectra-mcp = "vectra_mcp_server.cli:main"

[project.urls]
Homepage = "https://github.com/vectra-ai-research/vectra-ai-mcp-server"
Repository = "https://github.com/vectra-ai-research/vectra-ai-mcp-server"
Issues = "https://github.com/vectra-ai-research/vectra-ai-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectra_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "src/vectra_mcp_server",
    "README.md",
    "LICENSE",
    ".env.example",
    "tenants.yaml.example",
]
